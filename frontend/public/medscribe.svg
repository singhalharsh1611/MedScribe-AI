<svg width="450" height="120" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#2563EB" /> <!-- Blue 600 -->
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" /> <!-- Cyan 500 -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Blue 500 -->
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark / Icon -->
  <g transform="translate(15, 20)">
    <!-- Main Hexagon/Shield -->
    <path d="M40 0L74.641 20V60L40 80L5.359 60V20L40 0Z" fill="url(#grad1)" filter="url(#shadow)"/>
    
    <!-- Sound Waves / Medical Cross Hybrid -->
    <!-- Vertical wave -->
    <rect x="36" y="20" width="8" height="40" rx="4" fill="white" />
    <!-- Horizontal wave -->
    <rect x="20" y="36" width="40" height="8" rx="4" fill="white" />
    
    <!-- Outer wave bars -->
    <rect x="12" y="30" width="6" height="20" rx="3" fill="url(#grad2)" opacity="0.9"/>
    <rect x="62" y="30" width="6" height="20" rx="3" fill="url(#grad2)" opacity="0.9"/>
  </g>

  <!-- Text: MedScribe -->
  <text x="110" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#1E293B" letter-spacing="-1.5">
    MedScribe
  </text>
  
  <!-- Text: AI -->
  <text x="345" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#grad1)" letter-spacing="-1">
    AI
  </text>
  
  <!-- Subtitle -->
  <text x="114" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="2.5" text-transform="uppercase">
    Clinical Voice OS
  </text>
</svg>
